# Build, test and lint the Vocab Pass extension on every push and pull request.
# Mirrors the extension steps of the workspace workflow so this repo no longer depends on it.
name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.1'
          cache: npm
      - run: npm ci --no-audit --no-fund
      # build + node --test + web-ext lint (warnings are errors) + artifact content check
      - run: npm run release
      - uses: actions/upload-artifact@v4
        with:
          name: vocab-pass-dist
          path: dist/
          retention-days: 14
