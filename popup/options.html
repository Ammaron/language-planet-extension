<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title data-i18n="optionsTitle"></title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div id="options-app">
    <div class="options-header">
      <img src="../icons/langsly-icon.png" alt="" class="logo">
      <h1 data-i18n="optionsTitle"></h1>
    </div>

    <div class="options-section">
      <h2 data-i18n="accountSettingsTitle">Langsly account</h2>
      <p id="account-status" class="account-status" role="status"></p>
      <button id="account-connect" class="primary-btn hidden" type="button" data-i18n="connectLangslyAccount">Connect Langsly account</button>
      <button id="account-logout" class="secondary-btn hidden" type="button" data-i18n="logoutButton">Log out</button>
    </div>

    <div class="options-section">
      <h2 data-i18n="syncInterval"></h2>
      <div class="slider-row">
        <input type="range" id="sync-interval" min="15" max="240" step="15" value="60">
        <span id="sync-interval-label"></span>
      </div>
    </div>

    <div class="options-section">
      <h2 data-i18n="behaviorLabel"></h2>
      <p data-i18n="sensitiveProtectionLocked"></p>
    </div>

    <div class="options-footer">
      <button id="save-btn" class="primary-btn" data-i18n="saveSettings"></button>
      <button id="reset-preferences" class="secondary-btn" data-i18n="resetToDefaults"></button>
      <span id="save-status" class="save-status hidden" data-i18n="settingsSaved"></span>
    </div>
  </div>
  <script src="../vendor/browser-polyfill.min.js"></script>
  <script src="../shared/i18n.js"></script>
  <script src="options.js"></script>
</body>
</html>
